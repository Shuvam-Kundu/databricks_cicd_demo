# This is a Declarative Automation Bundle definition for demo_cicd_databeli.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: demo_cicd_databeli
  uuid: 9c1fce42-439d-4e5e-ade6-5302e8ade03c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-c1ee9fe0-bd2f.cloud.databricks.com
    variables:
      catalog: demo_cicd_databeli_dev
      schema: demo_cicd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-c1ee9fe0-bd2f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/shuvamkundu2@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shuvamkundu2@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: demo_cicd_databeli_dev
      schema: demo_cide
    permissions:
      - user_name: shuvamkundu2@gmail.com
        level: CAN_MANAGE
